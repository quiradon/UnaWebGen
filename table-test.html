<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Markdown Estilizado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div id="output" class="mt-4"></div>
    </div>

    <script>
        // Importar a função de markdown
        const { markdownToHtml } = require('./components/markdown.js');

        // Markdown de teste completo
        const testMarkdown = `
# 🚀 Guia Completo de Markdown Estilizado

Este é um exemplo **completo** de como o *markdown* é renderizado com **Bootstrap 5**.

## 📋 Funcionalidades Suportadas

### Texto e Formatação

Você pode usar **texto em negrito** e *texto em itálico* para dar ênfase. Também temos \`código inline\` que se destaca no texto.

### Listas Estilizadas

- Item da lista não ordenada
- Outro item importante
- Terceiro item com destaque

1. Primeiro item numerado
2. Segunda entrada
3. Terceira opção

### Citações

> "A programação é uma arte que combina criatividade com lógica."
> 
> Este é um exemplo de blockquote estilizado com Bootstrap.

### Links e Imagens

Visite o [GitHub](https://github.com) para mais projetos.

![Logo Exemplo](https://via.placeholder.com/300x200/007bff/ffffff?text=Imagem+de+Exemplo)

---

### Código

Aqui está um exemplo de código JavaScript:

\`\`\`javascript
function saudacao(nome) {
    console.log(\`Olá, \${nome}! Bem-vindo ao sistema.\`);
    
    if (nome) {
        return \`Usuário \${nome} logado com sucesso!\`;
    }
    
    return "Usuário anônimo";
}

// Chamada da função
saudacao("João");
\`\`\`

### Tabelas Responsivas

| 🎯 Recurso | 📊 Status | 🔧 Prioridade | 📅 Prazo |
|:-----------|----------:|:-------------:|:---------:|
| **Markdown Parser** | ✅ Completo | Alta | Concluído |
| **Tabelas** | ✅ Implementado | Média | Concluído |
| **Estilização** | 🔄 Em progresso | Alta | Esta semana |
| **Testes** | ⏳ Pendente | Baixa | Próxima semana |

#### Outra Tabela de Exemplo

## 🎨 Conclusão

Este sistema de markdown suporta uma ampla gama de elementos com **estilização moderna** usando Bootstrap 5. 

### Características principais:

- ✨ Design responsivo
- 🎯 Boa legibilidade  
- 🚀 Performance otimizada
- 💡 Fácil manutenção

*Obrigado por testar nosso sistema!*
        `;

        // Converter markdown para HTML
        const html = markdownToHtml(testMarkdown);
        
        // Exibir resultado
        document.getElementById('output').innerHTML = html;
    </script>
</body>
</html>
